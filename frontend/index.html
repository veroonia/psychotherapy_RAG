<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <section class="chat-card">

            <!-- Header -->
            <header class="topbar">

                <div class="brand">

                    <div class="brand-icon">
                        ✦
                    </div>

                    <div>
                        <h1>AI Chat</h1>

                        <span class="status">
                            <span></span>
                            Online
                        </span>
                    </div>

                </div>

                <button class="icon-btn" title="New chat" onclick="newChat()">
                    ＋
                </button>

            </header>


            <!-- Chat Messages -->
            <div class="messages" id="messages">

                <div class="welcome">

                    <div class="welcome-icon">
                        ✦
                    </div>

                    <h2>Good evening!</h2>

                    <p>
                        How can I help you today?
                    </p>

                </div>

            </div>


            <!-- Input Area -->
            <div class="input-area">

                <div class="input-row">

                    <textarea id="messageInput" rows="1" placeholder="Message AI Chat..." onkeydown="handleKey(event)">
                    </textarea>

                    <button class="send-btn" onclick="sendMessage()" title="Send">

                        <span>↑</span>

                    </button>

                </div>

                <div class="input-footer">
                    Press Enter to send · Shift + Enter for a new line
                </div>

            </div>

        </section>

    </main>


    <script>

        const input =
            document.getElementById("messageInput");

        const messages =
            document.getElementById("messages");


        /*
         * Send message when Enter is pressed.
         * Shift + Enter creates a new line.
         */
        function handleKey(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();
            }
        }


        /*
         * Send a message and get a real reply from the backend.
         */
        async function sendMessage() {

            const text =
                input.value.trim();

            if (!text) return;


            // Remove welcome message
            const welcome =
                document.querySelector(".welcome");

            if (welcome) {
                welcome.remove();
            }


            // Add user's message
            addMessage(text, "user");


            // Clear input
            input.value = "";


            // Show a placeholder bubble while we wait for the backend
            const thinkingBubble = addMessage("Thinking...", "bot");


            try {

                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || `Server error: ${response.status}`);
                }

                thinkingBubble.querySelector(".bubble").textContent = data.reply;

            } catch (err) {

                console.error(err);

                thinkingBubble.querySelector(".bubble").textContent =
                    "Sorry, I couldn't reach the AI backend. Is app.py running?";
            }


            messages.scrollTop = messages.scrollHeight;
        }


        /*
         * Add a message to the chat. Returns the created element so
         * callers can update it later (used for the "Thinking..." bubble).
         */
        function addMessage(text, type) {

            const message =
                document.createElement("div");

            message.className =
                `message ${type}`;


            message.innerHTML = `
                <div class="bubble">
                    ${escapeHtml(text)}
                </div>
            `;


            messages.appendChild(message);


            // Automatically scroll to newest message
            messages.scrollTop =
                messages.scrollHeight;

            return message;
        }


        /*
         * Start a new chat.
         */
        function newChat() {

            messages.innerHTML = `

                <div class="welcome">

                    <div class="welcome-icon">
                        ✦
                    </div>

                    <h2>Good evening!</h2>

                    <p>
                        How can I help you today?
                    </p>

                </div>

            `;

            input.focus();
        }


        /*
         * Prevent HTML injection.
         */
        function escapeHtml(text) {

            const div =
                document.createElement("div");

            div.textContent = text;

            return div.innerHTML;
        }

    </script>

</body>

</html>
